<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucy's Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Outfit:wght@500;600&family=Nothing+You+Could+Do&display=swap">
<style>
/* Layout: wordmark above a magazine. Home is the closed front cover; every other section is an open two-page spread. Pages turn in 3D from a grabbable corner. */
:root {
  --wall: #ffffff;
  --wall-2: #ffffff;
  --page: #faf8f3;
  --flap: #f3f0ea;
  --fg: #26201c;
  --muted: #8b847c;
  --line: #ddd8cf;
  --gutter: rgba(60, 45, 30, .16);
  --shadow: rgba(40, 30, 20, .2);
  --ink-sq: #1a1714;
  --cream-sq: #efe8da;
  --num: "Outfit", "Instrument Sans", sans-serif;
  --sans: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --hand: "Nothing You Could Do", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --wall:#1b1a18; --wall-2:#121110; --page:#24221f; --flap:#2e2b27; --fg:#efebe4; --muted:#9a938a; --line:#3a3631; --gutter:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.6); color-scheme: dark; }
}
:root[data-theme="dark"] { --wall:#1b1a18; --wall-2:#121110; --page:#24221f; --flap:#2e2b27; --fg:#efebe4; --muted:#9a938a; --line:#3a3631; --gutter:rgba(0,0,0,.45); --shadow:rgba(0,0,0,.6); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html { min-height: 100%; background: var(--wall-2); }
body {
  margin: 0; min-height: 100vh; color: var(--fg);
  background: var(--wall);
  font-family: var(--sans); font-size: 11px; line-height: 1.4; letter-spacing: .06em; text-transform: uppercase;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: clip;
}
a, button { color: inherit; text-decoration: none; font: inherit; letter-spacing: inherit; text-transform: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a:hover { opacity: .6; }
:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }
[hidden] { display: none !important; }

.stage { max-width: 1120px; margin-inline: auto; container-type: inline-size; }
.label { display: flex; justify-content: space-between; padding-block: 22px 0; font-style: italic; letter-spacing: .14em; }
.mark { display: flex; justify-content: space-between; gap: 0 .3em; margin: clamp(18px, 4vw, 44px) 0 clamp(18px, 3.5vw, 38px);
  font-weight: 500; font-size: clamp(30px, 11cqi, 150px); line-height: .9; letter-spacing: -.045em; }

/* ---------- The book ---------- */
.book { position: relative; margin-top: clamp(28px, 6vw, 72px); perspective: 5200px; touch-action: pan-y; transition: transform .9s cubic-bezier(.45,.05,.25,1); }
.book.closed { transform: translateX(-25%); }
.spread { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
.spread.open::after { /* centre fold */
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 90px; transform: translateX(-50%); pointer-events: none; z-index: 4;
  background: linear-gradient(90deg, transparent, var(--gutter) 46%, rgba(0,0,0,.26) 50%, var(--gutter) 54%, transparent); mix-blend-mode: multiply; }
.leaf { position: relative; min-width: 0; aspect-ratio: 4 / 5; overflow: hidden; background: var(--page);
  box-shadow: 0 24px 40px -18px var(--shadow); }
.leaf.ghost { background: transparent; box-shadow: none; }
.leaf.pad { padding: clamp(22px, 4.5cqi, 56px); display: flex; flex-direction: column; }
.leaf.full { grid-column: 1 / -1; aspect-ratio: 8 / 5; }
.folio { position: absolute; bottom: 14px; right: 18px; font-size: 10px; color: var(--muted); letter-spacing: .1em; z-index: 2; }
.bleed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.bleed svg { width: 100%; height: 100%; display: block; }
.pimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* Front cover */
.cover { color: #fff; border-radius: 2px 4px 4px 2px;
  box-shadow: 1px 1px 0 #f4f0e8, 3px 3px 0 #ddd6ca, 4px 4px 0 #f4f0e8, 6px 6px 0 #d6cfc2, 7px 7px 0 #f1ece3, 9px 9px 0 #cfc7b9, 0 40px 60px -24px var(--shadow); }
.cover::before { content: ""; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45)); }
.cover::after { /* spine crease */
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 26px; z-index: 2;
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.12) 40%, rgba(0,0,0,.12) 60%, transparent); }
.cover-ink { position: absolute; z-index: 3; top: 26px; left: 44px; right: 26px; display: flex; justify-content: space-between; letter-spacing: .16em; }
.cover-title { position: absolute; z-index: 3; left: 40px; bottom: 30px; margin: 0; font-size: clamp(40px, 6.6cqi, 82px); transform: rotate(-5deg); transform-origin: left bottom; }

.eyebrow { color: var(--muted); }
.title { margin: 12px 0 14px; font-weight: 500; font-size: clamp(30px, 5cqi, 60px); line-height: .95; letter-spacing: -.035em; text-transform: uppercase; text-wrap: balance; }
.title small { font-size: .42em; font-weight: 400; text-transform: none; letter-spacing: -.01em; vertical-align: top; position: relative; top: .2em; }
.prose { max-width: 42ch; font-size: 14px; line-height: 1.6; letter-spacing: 0; text-transform: none; margin: 0 0 14px; }
.hand { font-family: var(--hand); text-transform: none; letter-spacing: 0; line-height: 1.25; }
.scribble { font-size: clamp(32px, 5cqi, 60px); margin: auto 0 0; transform: rotate(-4deg); transform-origin: left bottom; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; border-top: 1px solid var(--line); padding-top: 12px; margin: 6px 0 0; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-top: 16px; }
.ph { position: relative; display: block; overflow: hidden; aspect-ratio: 4 / 3; background: var(--line); transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s; }
.ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph:hover { transform: scale(1.12); z-index: 3; box-shadow: 0 18px 40px rgba(0,0,0,.25); }

/* Appendix collage */
.collage { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px 8px; margin-top: 4px; }
.piece { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.piece:hover { opacity: 1; z-index: 6; }
.frame { position: relative; display: block; flex: 1; min-height: 0; overflow: hidden; background: var(--line); transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s; }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.n { font-size: clamp(22px, 3.4cqi, 40px); line-height: 1; letter-spacing: -.04em; padding-top: .12em; }
.peek { position: absolute; inset: auto 0 0 0; padding: 12px; color: #fff; text-transform: none; letter-spacing: 0; font-size: 12px; line-height: 1.35;
  background: linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0)); opacity: 0; transform: translateY(8px); transition: opacity .35s .08s, transform .35s .08s; }
.peek b { display: block; font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.piece:hover .frame, .piece:focus-visible .frame { transform: scale(1.1); box-shadow: 0 22px 50px rgba(0,0,0,.25); }
.piece:hover .peek, .piece:focus-visible .peek { opacity: 1; transform: none; }
.p1 { grid-column: 1 / 5; grid-row: 1 / 3; }
.p2 { grid-column: 5 / 9; grid-row: 1; }
.p3 { grid-column: 9 / 13; grid-row: 1; } .p3 .n { align-self: flex-end; }
.p4 { grid-column: 5 / 8; grid-row: 2 / 4; }
.p5 { grid-column: 8 / 13; grid-row: 2; }
.p6 { grid-column: 9 / 13; grid-row: 3; flex-direction: row; align-items: flex-end; gap: 10px; margin-right: 34px; } .p6 .frame { align-self: stretch; }
.key { grid-column: 1 / 5; grid-row: 3; align-self: end; list-style: none; margin: 0; padding: 0 0 8px; display: grid; gap: 4px;
  text-transform: none; letter-spacing: 0; font-size: clamp(12px, 1.25cqi, 15px); line-height: 1.3; }
.key b { font-weight: 600; }
/* Featured works: a checkerboard of squares with photos dropped in */
.checker { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); overflow: visible; }
.cell.ink { background: var(--ink-sq); } .cell.cream { background: var(--cream-sq); }
.tile { position: relative; overflow: hidden; z-index: 1; transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s; }
.tile:hover, .tile:focus-visible { opacity: 1; transform: scale(1.28); z-index: 6; box-shadow: 0 24px 50px rgba(0,0,0,.28); }
.num { position: absolute; left: 10%; bottom: 8%; z-index: 2; color: #fff; font-family: var(--num); font-weight: 600; font-size: clamp(22px, 3.6cqi, 44px); letter-spacing: -.02em; line-height: 1; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
.tile .peek { z-index: 3; }
.tile:hover .num, .tile:focus-visible .num { opacity: 0; transition: opacity .2s; }
.tile:hover .peek, .tile:focus-visible .peek { opacity: 1; transform: none; }
.ck-title { align-self: start; padding: clamp(16px, 2.6cqi, 30px) 0 0 clamp(16px, 2.6cqi, 30px); }
.ck-title .title { margin: 8px 0 0; font-size: clamp(20px, 2.6cqi, 32px); }
.checker .key { align-self: end; padding: 0 0 clamp(14px, 2cqi, 24px) 60px; font-size: clamp(11px, 1.05cqi, 13px); gap: 2px; }


/* Half of a full-width spread, used while a page is mid-turn */
.halfclip { padding: 0 !important; }
.halfclip > .halfinner { width: 200%; height: 100%; }
.halfclip > .halfinner > .leaf { box-shadow: none; }
.halfclip.r > .halfinner { margin-left: -100%; }

/* ---------- Turning sheet ---------- */
.sheet { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 8; transform-style: preserve-3d; pointer-events: none; }
.sheet.fwd { left: 50%; transform-origin: 0 50%; }
.sheet.bwd { left: 0; transform-origin: 100% 50%; }
/* The turning page is a chain of thin strips, each hinged to the last, so it can bend like paper */
.strip { position: absolute; top: 0; bottom: 0; transform-style: preserve-3d; will-change: transform; outline: 1px solid transparent; }
.sheet.fwd .strip { left: 100%; transform-origin: 0 50%; }
.sheet.bwd .strip { right: 100%; transform-origin: 100% 50%; }
.sheet.fwd > .strip { left: 0; } .sheet.bwd > .strip { right: 0; }
.sface { position: absolute; top: 0; bottom: 0; left: -3px; right: -3px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.sface.back { transform: rotateY(180deg); }
.sface > .slice { position: absolute; top: 0; bottom: 0; }
.sface > .slice > .leaf { width: 100%; height: 100%; box-shadow: none; }
.sface::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 9; background: #000; opacity: var(--s, 0); }
.sface::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 9; background: #fff; opacity: var(--h, 0); }
.cast { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 7; pointer-events: none; opacity: var(--cast, 0); }
.cast.r { left: 50%; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.06) 60%, transparent); }
.cast.l { left: 0;   background: linear-gradient(270deg, rgba(0,0,0,.35), rgba(0,0,0,.06) 60%, transparent); }

/* ---------- Grabbable corners ---------- */
.corner { position: absolute; bottom: 0; width: 52px; height: 52px; z-index: 10; cursor: grab; }
.corner:active { cursor: grabbing; }
.corner.r { right: 0; }
.corner.l { left: 0; }
/* No fold, just a soft shadow gathering where the page would lift */
.corner::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
.corner.r::before { background: radial-gradient(circle at 100% 100%, rgba(60,45,30,.10), rgba(60,45,30,.04) 35%, transparent 70%); }
.corner.l::before { background: radial-gradient(circle at 0% 100%, rgba(60,45,30,.10), rgba(60,45,30,.04) 35%, transparent 70%); }
.corner:hover::before, .corner.lift::before { opacity: 1; }
.book.dragging .corner { display: none; }

/* ---------- Below the book ---------- */
.below { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 30px 10px; }
.tabs { display: flex; gap: 6px; }
.tabs a { padding: 9px 16px; border: 1px solid var(--fg); border-radius: 999px; }
.tabs a[aria-current="page"] { background: var(--fg); color: var(--page); }
.tabs a:hover { opacity: 1; background: var(--fg); color: var(--page); }
#t-next { text-align: right; }
.note { display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px; padding: 14px 4% 0; min-height: 90px; }
.note p { margin: 0; font-size: clamp(20px, 2.4cqi, 28px); text-align: center; max-width: 16em; }
.note svg { flex: none; width: 80px; height: 60px; color: var(--fg); margin-top: -8px; }
footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-block: 34px 24px; color: var(--muted); }


/* ---------- Intro ---------- */
.intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--wall);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .6s ease; }
.intro.out { opacity: 0; pointer-events: none; }
html.intro-on { overflow: hidden; }
.intro-scene { width: min(1000px, 100%); height: auto; max-height: 86vh; overflow: visible; }
.intro .ink { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.intro .thin { stroke-width: 1.5; opacity: .5; }
.intro .case { stroke-width: 2.5; }
.intro #f-head { fill: var(--wall); }
.intro #shelf, .intro #fig { transition: none; }
#tb-rect { fill: var(--fg); }
#tb-text { fill: var(--wall); font: 600 10px var(--sans); letter-spacing: 2px; text-anchor: middle; dominant-baseline: middle; }
.intro-skip { position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); bottom: max(22px, env(safe-area-inset-bottom, 0px)); color: var(--muted); }
.intro-skip:hover { color: var(--fg); }

@media (max-width: 760px) {
  .book.closed { transform: none; }
  .spread { grid-template-columns: 1fr; }
  .spread.open::after, .leaf.ghost, .corner { display: none; }
  .leaf, .leaf.full { aspect-ratio: auto; }
  .leaf.bleedpage, .cover { aspect-ratio: 4 / 5; }
  .leaf.pad { min-height: 120vw; }
  .collage { grid-template-columns: 1fr 1fr; grid-template-rows: none; column-gap: 10px; row-gap: 14px; }
  .frame { flex: none; aspect-ratio: 4 / 5; }
  .n { font-size: 34px; }
  .collage .piece, .collage .key { grid-column: auto; grid-row: auto; margin-top: 0; }
  .collage .p1, .collage .key { grid-column: 1 / -1; }
  .p1 .frame { aspect-ratio: 4 / 3; }
  .p6 { flex-direction: column; align-items: stretch; } .p6 .frame { width: 100%; }
  .p3 .n { align-self: flex-start; }
  .checker { grid-template-columns: 1fr 1fr; grid-template-rows: none; gap: 0; }
  .checker .cell { display: none; }
  .checker > * { grid-area: auto !important; }
  .checker .tile { aspect-ratio: 1; }
  .checker .ck-title, .checker .key { grid-column: 1 / -1 !important; padding: 18px; }
  .checker .tile:hover { transform: scale(1.04); }
  .below { grid-template-columns: 1fr 1fr; }
  .tabs { grid-column: 1 / -1; grid-row: 1; justify-content: center; flex-wrap: wrap; }
  .note svg { display: none; }
  .note { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

// Soft photographic placeholder: blurred colour fields + grain.
// Placeholders are drawn once as images and reused, so the many copies on a turning page stay light.
const photoCache = new Map();
function photo(pal, seed = 0) {
  const key = pal.join() + "|" + seed;
  if (!photoCache.has(key)) {
    const r = n => { seed = (seed * 9301 + 49297) % 233280; return (seed / 233280) * n; };
    const [a, b, c] = pal;
    const blobs = Array.from({ length: 5 }, (_, k) =>
      `<ellipse cx="${r(100)}" cy="${r(60)}" rx="${18 + r(30)}" ry="${10 + r(20)}" fill="${[a,b,c][k % 3]}" opacity="${.55 + r(.4)}"/>`).join("");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="1000" height="600" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="${seed % 50}"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .22 0"/></filter></defs><rect width="100" height="60" fill="url(#g)"/><g filter="url(#b)">${blobs}</g><rect width="100" height="60" filter="url(#n)"/></svg>`;
    photoCache.set(key, "data:image/svg+xml," + encodeURIComponent(svg));
  }
  return `<img class="pimg" src="${photoCache.get(key)}" alt="" draggable="false">`;
}

const pad = n => String(n).padStart(2, "0");
const slug = i => "work-" + pad(i + 1);
const $ = id => document.getElementById(id);

// The book, in reading order. "" is the front cover.
const book = ["", "about", "works", ...works.map((_, i) => slug(i)), "contact"];
const label = h => h === "" ? "Cover" : h === "about" ? "About Lucy" : h === "works" ? "Featured works" : h === "contact" ? "Contact" : (works.find((_, k) => slug(k) === h) || {}).t;
const folio = n => `<span class="folio">${pad(n)} / ${pad(book.length)}</span>`;
// One shared blob URL for the photo, so copies on the bending strips stay light.
const LUCY_SRC = (() => { try { const b = atob(LUCY.split(",")[1]), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return URL.createObjectURL(new Blob([u], { type: "image/jpeg" })); } catch (_) { return LUCY; } })();
const lucyImg = pos => `<img class="bleed" src="${LUCY_SRC}" alt="Lucy Campbell by the Yarra River in Melbourne" style="object-position:${pos}" draggable="false">`;
const GHOST = `<div class="leaf ghost"></div>`;

// Each section as [left page, right page]; a single entry spans both pages.
function leaves(h) {
  const n = book.indexOf(h) + 1;
  if (h === "") return [GHOST,
    `<div class="leaf cover">${lucyImg("62% 40%")}<div class="cover-ink"><span>Lucy's Studio</span><span>Vol. 01 · 2026</span></div><p class="hand cover-title">this is Lucy.</p></div>`];
  if (h === "about") return [
    `<div class="leaf pad"><span class="eyebrow">( ${pad(n)} )</span><h2 class="title">About Lucy</h2>
      <p class="prose">A short paragraph about you. What you make, who you make it with, and where you are based.</p>
      <p class="prose">A second paragraph on how you work, what you care about, and what you'd like to do next.</p>
      <p class="hand scribble">brand, story, image.</p></div>`,
    `<div class="leaf bleedpage">${lucyImg("60% 35%")}${folio(n)}</div>`];
  if (h === "works") {
    // 8 x 5 squares fills the two-page spread exactly. "w" squares stay empty to give the stepped edge.
    const empty = ["1-3", "2-1", "3-8", "4-8", "5-3", "5-7", "5-8"];
    const spots = [{ r: 1, c: 7 }, { r: 2, c: 4, rs: 2 }, { r: 3, c: 3 }, { r: 3, c: 6 }, { r: 4, c: 2 }, { r: 5, c: 5 }];
    let cells = "";
    for (let r = 1; r <= 5; r++) for (let c = 1; c <= 8; c++) {
      if ((r === 1 || r === 5) && c <= 2) continue;          // title and key corners
      if (empty.includes(r + "-" + c)) continue;
      cells += `<span class="cell ${(r + c) % 2 ? "ink" : "cream"}" style="grid-area:${r}/${c}"></span>`;
    }
    const tiles = works.map((w, i) => {
      const s = spots[i];
      return `<a class="tile" href="#${slug(i)}" aria-label="${pad(i + 1)} ${w.t}" style="grid-area:${s.r}/${s.c}/span ${s.rs || 1}/span 1">
        ${photo(w.pal, i * 10 + 3)}<span class="num">${pad(i + 1)}</span><span class="peek"><b>${w.t}</b>${w.s}</span></a>`;
    }).join("");
    return [
      `<div class="leaf full checker">${cells}
        <div class="ck-title" style="grid-area:1/1/span 1/span 2"><span class="eyebrow">( ${pad(n)} )</span><h2 class="title">Featured works <small>(Appendix)</small></h2></div>
        ${tiles}
        <ol class="key" style="grid-area:5/1/span 1/span 2">${works.map((w, i) => `<li><a href="#${slug(i)}"><b>${pad(i + 1)} ${w.cat}:</b> ${w.t}</a></li>`).join("")}</ol>
        ${folio(n)}</div>`];
  }
  if (h === "contact") return [
    `<div class="leaf pad"><span class="eyebrow">( ${pad(n)} )</span><h2 class="title">Contact details</h2>
      <dl class="meta"><dt>Email</dt><dd>lucy@yourstudio.com</dd><dt>LinkedIn</dt><dd><a href="https://www.linkedin.com/" target="_blank" rel="noopener">Add your profile ↗</a></dd><dt>Based in</dt><dd>Melbourne, Australia</dd></dl>
      <p class="hand scribble">say hello.</p></div>`,
    `<div class="leaf bleedpage"><span class="bleed">${photo(["#5f8a4a", "#8fb4c9", "#d9e3c4"], 21)}</span>${folio(n)}</div>`];
  const i = works.findIndex((_, k) => slug(k) === h), w = works[i];
  return [
    `<div class="leaf bleedpage"><span class="bleed">${photo(w.pal, i * 10 + 3)}</span></div>`,
    `<div class="leaf pad"><span class="eyebrow">( ${pad(i + 1)} ) ${w.cat}</span><h2 class="title">${w.t}</h2>
      <p class="prose"><b>${w.s}</b></p><p class="prose">${extra}</p>
      <dl class="meta"><dt>Year</dt><dd>${w.y}</dd><dt>Type</dt><dd>${w.cat}</dd><dt>Place</dt><dd>${w.place}</dd></dl>
      <div class="pair"><span class="ph">${photo([w.pal[1], w.pal[2], w.pal[0]], i * 10 + 4)}</span><span class="ph">${photo([w.pal[2], w.pal[0], w.pal[1]], i * 10 + 5)}</span></div>
      ${folio(n)}</div>`];
}
// Always two halves, cutting a full-width spread down the fold when needed.
function halves(h) {
  const l = leaves(h);
  if (l.length === 2) return l;
  return ["l", "r"].map(side => `<div class="leaf halfclip ${side}"><div class="halfinner">${l[0]}</div></div>`);
}

const notes = { "": "pick up the corner and open me.", about: "the person behind the pictures.", works: "hover to peek, click to read.", contact: "always happy to chat." };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = () => matchMedia("(max-width: 760px)").matches;
const bookEl = $("book");
let current = "", busy = false;

function chrome(h) {
  const n = book.indexOf(h), prev = book[n - 1], nx = book[n + 1];
  $("t-prev").style.visibility = prev === undefined ? "hidden" : ""; $("t-next").style.visibility = nx === undefined ? "hidden" : "";
  if (prev !== undefined) { $("t-prev").href = "#" + prev; $("t-prev").textContent = "← " + label(prev); }
  if (nx !== undefined) { $("t-next").href = "#" + nx; $("t-next").textContent = (h === "" ? "Open" : label(nx)) + " →"; }
  document.querySelectorAll(".tabs a").forEach(a => {
    const t = a.getAttribute("href").slice(1), on = t === h || (t === "works" && h.startsWith("work-"));
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function render(h) {
  current = h;
  const n = book.indexOf(h);
  bookEl.classList.toggle("closed", h === "");
  bookEl.classList.remove("dragging");
  bookEl.innerHTML = `<div class="spread ${h === "" ? "" : "open"}">${leaves(h).join("")}</div>` +
    (book[n + 1] !== undefined ? `<div class="corner r" data-dir="1" aria-label="Turn the page"></div>` : "") +
    (n > 0 ? `<div class="corner l" data-dir="-1" aria-label="Turn back"></div>` : "");
  chrome(h);
}

// Build a mid-turn book: the page underneath plus a two-sided sheet hinged at the spine.
// The sheet is a chain of strips, each nested in the one before, so the bends add up like paper.
const STRIPS = 6;
function sheetHTML(front, back, fwd, n) {
  let html = "";
  const slice = (c, o) => n === 1
    ? `<div class="slice" style="width:100%;left:0">${c}</div>`
    : `<div class="slice" style="width:calc((100% - 6px) * ${n});left:calc(3px - (100% - 6px) * ${o})">${c}</div>`;
  for (let k = n - 1; k >= 0; k--) {
    const fo = fwd ? k : n - 1 - k, bo = fwd ? n - 1 - k : k;
    const edge = n === 1 ? ' style="left:0;right:0"' : "";
    html = `<div class="strip" style="width:${k === 0 ? 100 / n + "%" : "100%"}"><div class="sface front"${edge}>${slice(front, fo)}</div><div class="sface back"${edge}>${slice(back, bo)}</div>${html}</div>`;
  }
  return html;
}
function setupTurn(to) {
  const from = current, fwd = book.indexOf(to) > book.indexOf(from);
  const [fl, fr] = halves(from), [tl, tr] = halves(to);
  const openBase = !(fwd ? from === "" : to === "");
  const stiff = from === "" || to === "";            // the cover is card, so it barely bends
  bookEl.classList.add("dragging");
  bookEl.innerHTML = `<div class="spread ${openBase ? "open" : ""}">${fwd ? fl + tr : tl + fr}</div>
    <div class="cast ${fwd ? "r" : "l"}"></div>
    <div class="sheet ${fwd ? "fwd" : "bwd"}">${sheetHTML(fwd ? fr : fl, fwd ? tl : tr, fwd, stiff ? 1 : STRIPS)}</div>`;
  const sheet = bookEl.querySelector(".sheet"), cast = bookEl.querySelector(".cast");
  const strips = [...sheet.querySelectorAll(".strip")];
  const faces = strips.map(st => [st.children[0], st.children[1]]);
  const shiftFrom = from === "" ? -25 : 0, shiftTo = to === "" ? -25 : 0;
  const sign = fwd ? -1 : 1, deg = Math.PI / 180;
  bookEl.style.transition = "none";
  bookEl.classList.remove("closed");
  const set = p => {
    const lift = Math.sin(p * Math.PI);
    // The free edge runs ahead of the spine, so the page curls over as it turns.
    const curl = (stiff ? .06 : .16) * lift;
    let prev = 0;
    strips.forEach((st, k) => {
      const t = strips.length > 1 ? k / (strips.length - 1) : 0;
      const q = Math.min(1, Math.max(0, p + curl * (Math.pow(t, 1.7) - .3 * t)));
      const A = 180 * q;
      st.style.transform = `rotateY(${sign * (A - prev)}deg)`;
      prev = A;
      // Light falls off as the paper tilts away; the crest of the curl catches a little highlight.
      const tilt = Math.sin(A * deg), [f, b] = faces[k];
      f.style.setProperty("--s", (tilt * (A < 90 ? .16 : .3)).toFixed(3));
      b.style.setProperty("--s", (tilt * (A > 90 ? .14 : .3)).toFixed(3));
      const crest = Math.max(0, Math.cos((A - 60) * deg)) * lift * .10;
      f.style.setProperty("--h", crest.toFixed(3)); b.style.setProperty("--h", (crest * .6).toFixed(3));
    });
    // The leaf lifts off the page a touch and leads with its bottom corner.
    sheet.style.transform = `translateZ(${(lift * 10).toFixed(2)}px)`;
    cast.style.setProperty("--cast", ((1 - p) * lift * 1.3).toFixed(3));
    if (!narrow()) bookEl.style.transform = `translateX(${shiftFrom + (shiftTo - shiftFrom) * p}%)`;
  };
  const done = landed => {
    bookEl.style.transform = ""; bookEl.style.transition = "";
    render(landed ? to : from);
    if (landed) { try { if (location.hash.slice(1) !== to) location.hash = to; } catch (_) {} }
    busy = false;
  };
  set(0);
  return { set, done };
}

const easeInOut = x => -(Math.cos(Math.PI * x) - 1) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
function animateTo(t, p0, p1, ms, cb, ease = easeInOut) {
  let start = null;
  const step = now => {
    if (start === null) start = now;             // heavy setup can't steal time from the turn
    const k = Math.min(1, (now - start) / ms);
    t.set(p0 + (p1 - p0) * ease(k));
    if (k < 1) requestAnimationFrame(step); else requestAnimationFrame(cb);
  };
  requestAnimationFrame(() => requestAnimationFrame(step));   // let the new page paint first
}

// Phones: swing the whole page on its spine.
function swing(to) {
  const fwd = book.indexOf(to) > book.indexOf(current);
  bookEl.style.transformOrigin = fwd ? "0 50%" : "100% 50%";
  const out = bookEl.animate([{ transform: "perspective(1400px) rotateY(0deg)" }, { transform: `perspective(1400px) rotateY(${fwd ? -88 : 88}deg)`, opacity: .6 }], { duration: 300, easing: "ease-in" });
  out.onfinish = () => {
    render(to);
    try { if (location.hash.slice(1) !== to) location.hash = to; } catch (_) {}
    window.scrollTo({ top: bookEl.getBoundingClientRect().top + scrollY - 20, behavior: "smooth" });
    const back = bookEl.animate([{ transform: `perspective(1400px) rotateY(${fwd ? 88 : -88}deg)`, opacity: .6 }, { transform: "perspective(1400px) rotateY(0deg)" }], { duration: 360, easing: "ease-out" });
    back.onfinish = () => { bookEl.style.transformOrigin = ""; busy = false; };
  };
}

function turn(to) {
  if (book.indexOf(to) < 0) to = "";
  if (busy || to === current) return;
  if (reduced()) { render(to); try { location.hash = to; } catch (_) {} return; }
  busy = true;
  if (narrow()) return swing(to);
  const t = setupTurn(to);
  animateTo(t, 0, 1, 1300, () => t.done(true));
}

// Grab a corner and drag it across the spread.
bookEl.addEventListener("pointerdown", e => {
  const c = e.target.closest(".corner");
  if (!c || busy) return;
  e.preventDefault();
  const dir = +c.dataset.dir, to = book[book.indexOf(current) + dir];
  if (to === undefined) return;
  busy = true;
  const rect = bookEl.getBoundingClientRect(), w = rect.width, x0 = e.clientX;
  const t = setupTurn(to);
  let p = 0, shown = 0, moved = false, lastX = x0, vx = 0, live = true;
  bookEl.setPointerCapture(e.pointerId);
  const follow = () => { if (!live) return; shown += (p - shown) * .2; t.set(shown); requestAnimationFrame(follow); };
  requestAnimationFrame(follow);
  const move = ev => {
    const dx = ev.clientX - x0;
    if (Math.abs(dx) > 4) moved = true;
    vx = vx * .6 + (ev.clientX - lastX) * .4; lastX = ev.clientX;
    p = Math.max(0, Math.min(1, (dir > 0 ? -dx : dx) / w));
  };
  let released = false;
  const up = () => {
    if (released) return; released = true;
    bookEl.removeEventListener("lostpointercapture", up);
    bookEl.removeEventListener("pointermove", move);
    bookEl.removeEventListener("pointerup", up);
    bookEl.removeEventListener("pointercancel", up);
    live = false;
    const flick = (dir > 0 ? -vx : vx) > 5;
    const finish = !moved || p > .35 || flick;
    const target = finish ? 1 : 0;
    if (!moved) return animateTo(t, 0, 1, 1300, () => t.done(true));
    animateTo(t, shown, target, Math.max(380, 1100 * Math.abs(target - shown)), () => t.done(finish), easeOut);
  };
  bookEl.addEventListener("pointermove", move);
  bookEl.addEventListener("pointerup", up);
  bookEl.addEventListener("pointercancel", up);
  bookEl.addEventListener("lostpointercapture", up);
});

// Phones: swipe to turn.
let sx = null, sy = null;
bookEl.addEventListener("touchstart", e => { if (narrow()) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
bookEl.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const to = book[book.indexOf(current) + (dx < 0 ? 1 : -1)];
    if (to !== undefined) turn(to);
  }
}, { passive: true });

// Handle in-page links ourselves so they work in embedded previews too.
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  turn(a.getAttribute("href").slice(1));
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h !== current && !busy) turn(h); });
addEventListener("keydown", e => {
  const n = book.indexOf(current);
  const to = e.key === "ArrowRight" ? book[n + 1] : e.key === "ArrowLeft" ? book[n - 1] : undefined;
  if (to !== undefined) turn(to);
});

render(book.includes(location.hash.slice(1)) ? location.hash.slice(1) : "");

// ---------- Intro: a stick figure runs to a bookcase and pulls out this book ----------
function hintCorner() {
  if (current !== "" || reduced()) return;
  setTimeout(() => {
    const c = bookEl.querySelector(".corner.r"); if (!c) return;
    c.classList.add("lift"); setTimeout(() => c.classList.remove("lift"), 1400);
  }, 700);
}
(function intro() {
  const el = $("intro");
  let seen = false;
  try { seen = sessionStorage.getItem("lucy-intro") === "1"; } catch (_) {}
  if (location.hash.slice(1) || seen || reduced()) { el.remove(); hintCorner(); return; }
  try { sessionStorage.setItem("lucy-intro", "1"); } catch (_) {}
  document.documentElement.classList.add("intro-on");

  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  // Fill the shelves with spines, leaving a gap on the middle shelf for Lucy's book.
  const tones = ["#c9b9a0", "#7d93a6", "#b48a5b", "#8b8b86", "#efe8da", "#5d6b4a", "#d8cdb3", "#a7a49b", "#9fb6c4"];
  const books = $("books");
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  [[222, 130], [314, 222], [421, 314]].forEach(([base, top], shelf) => {
    let x = 706;
    while (x < 912) {
      const w = 12 + Math.round(rnd() * 12), h = Math.min(base - top - 8, 52 + Math.round(rnd() * 28));
      if (shelf === 1 && x < 736) { x = 736; continue; }      // the gap for the real book
      if (x + w > 914) break;
      const lean = shelf === 2 && x > 880 ? 8 : 0;
      books.appendChild(svgEl("rect", { x, y: base - h, width: w, height: h, rx: 1.5, fill: tones[Math.floor(rnd() * tones.length)],
        transform: lean ? `rotate(${lean} ${x} ${base})` : "" }));
      x += w + 1;
    }
  });
  const tb = $("the-book"), BX = 710, BY = 244;           // Lucy's book sits on the middle shelf

  // Stick figure, drawn fresh every frame.
  const L = 40, T = 58, A = 30;
  const P = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
  const parts = { head: $("f-head"), body: $("f-body"), arm1: $("f-arm1"), arm2: $("f-arm2"), leg1: $("f-leg1"), leg2: $("f-leg2") };
  function drawFigure(hx, phase, run, reach, grip) {
    const bob = run * 4 * Math.abs(Math.sin(phase));
    const hy = 343 - bob + (1 - run) * 2;
    const lean = run * .2;
    const sx = hx + T * Math.sin(lean), sy = hy - T * Math.cos(lean);
    parts.body.setAttribute("x1", hx); parts.body.setAttribute("y1", hy); parts.body.setAttribute("x2", sx); parts.body.setAttribute("y2", sy);
    parts.head.setAttribute("cx", sx + 20 * Math.sin(lean) + 1); parts.head.setAttribute("cy", sy - 20);
    [0, 1].forEach(i => {
      const ph = phase + i * Math.PI, side = i ? 1 : -1;
      // legs: thigh swings, shin folds back on the recovery stroke
      const a = run * .7 * Math.sin(ph) + (1 - run) * .1 * side;
      const kx = hx + L * Math.sin(a), ky = hy + L * Math.cos(a);
      const b = a - run * 1.15 * Math.max(0, Math.sin(ph + 1.7));
      parts[i ? "leg2" : "leg1"].setAttribute("points", `${P(hx, hy)} ${P(kx, ky)} ${P(kx + L * Math.sin(b), ky + L * Math.cos(b))}`);
      // arms: swing opposite the legs with a bent elbow
      const u = -run * .85 * Math.sin(ph) + (1 - run) * .12 * side;
      let ex = sx + A * Math.sin(u), ey = sy + 4 + A * Math.cos(u);
      const f = u + run * 1.5 + (1 - run) * .1;
      let hx2 = ex + A * Math.sin(f), hy2 = ey + A * Math.cos(f);
      if (i === 0 && reach > 0) {                       // front arm reaches for the book
        const tx = grip[0], ty = grip[1];
        const mx = (sx + tx) / 2, my = (sy + 4 + ty) / 2 + 12;
        ex += (mx - ex) * reach; ey += (my - ey) * reach;
        hx2 += (tx - hx2) * reach; hy2 += (ty - hy2) * reach;
      }
      parts[i ? "arm2" : "arm1"].setAttribute("points", `${P(sx, sy + 4)} ${P(ex, ey)} ${P(hx2, hy2)}`);
    });
  }

  const clamp = x => Math.max(0, Math.min(1, x));
  const sm = x => x * x * (3 - 2 * x);
  const RUN = 2500, REACH = 2950, PULL = 3700, LIFT = 4500, END = 5000;
  let t0 = null, done = false;
  function frame(now) {
    if (done) return;
    if (t0 === null) t0 = now;
    const t = now - t0;
    // run: mostly even pace, easing into a stop in front of the bookcase
    const k = clamp(t / RUN);
    const x = -50 + 702 * (k - Math.sin(2 * Math.PI * k) / (2 * Math.PI) * .55);
    const run = 1 - sm(clamp((t - RUN + 350) / 450));
    const reach = sm(clamp((t - RUN) / (REACH - RUN)));
    // pull: the book slides off the shelf towards the runner, tipping as it clears
    const pull = sm(clamp((t - REACH) / (PULL - REACH)));
    const lift = sm(clamp((t - PULL) / (LIFT - PULL)));
    const bx = BX - 22 * pull, by = BY + 14 * pull, rot = -12 * pull * (1 - lift);
    const grip = [bx + 6, by + 22];
    // lift: the book grows towards you and becomes the cover underneath
    const s = 1 + 3.2 * lift * lift, cx = bx + 11, cy = by + 35;
    const tx = (500 - cx) * lift, ty = (250 - cy) * lift;
    tb.setAttribute("transform", `translate(${tx} ${ty}) translate(${bx} ${by}) rotate(${rot} 11 35) translate(11 35) scale(${s}) translate(-11 -35)`);
    tb.style.opacity = 1 - clamp((t - (LIFT - 420)) / 420);
    $("fig").style.opacity = 1 - clamp((t - PULL - 150) / 400);
    $("shelf").style.opacity = 1 - clamp((t - PULL) / 500);
    drawFigure(x, x / 21, run, reach * (1 - lift), lift > 0 ? [bx + 6, by + 22] : grip);
    if (t > LIFT - 150) el.classList.add("out");
    if (t < END) requestAnimationFrame(frame); else finish();
  }
  function finish() {
    if (done) return; done = true;
    el.classList.add("out");
    document.documentElement.classList.remove("intro-on");
    setTimeout(() => { el.remove(); hintCorner(); }, 650);
  }
  $("intro-skip").addEventListener("click", finish);
  addEventListener("keydown", e => { if (e.key === "Escape") finish(); }, { once: true });
  drawFigure(-50, 0, 1, 0, [0, 0]);
  tb.setAttribute("transform", `translate(${BX} ${BY})`);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
